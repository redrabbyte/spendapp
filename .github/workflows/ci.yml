name: CI

on:
  push:
    branches: [main]
  pull_request:

# This job reads the code and uploads a report; it writes nothing back. Without
# this the token inherits the repository default, which is often read-write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # >= 22.13: required by pnpm 11, and loadEnvFile() in config.ts.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      # Only Chromium: the suite emulates a phone, and the install prompt it
      # exercises is Chromium-only anyway.
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
          # A red run with no report is how the path silently rotted before:
          # upload-artifact only warns by default, and a warning inside an
          # already-failing job is a warning nobody reads.
          if-no-files-found: error
