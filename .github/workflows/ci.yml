name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # >= 22.13: required by pnpm 11, and loadEnvFile() in config.ts.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      # Only Chromium: the suite emulates a phone, and the install prompt it
      # exercises is Chromium-only anyway.
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
          # A red run with no report is how the path silently rotted before:
          # upload-artifact only warns by default, and a warning inside an
          # already-failing job is a warning nobody reads.
          if-no-files-found: error
